<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紅白機音樂盒</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c1917; --body:#d6d0c2; --body-dk:#b4ad9c; --red:#b3261e; --ink:#26211f;
  --screen:#0f1a2b; --screen-ln:#1c2b45; --gold:#e8b94a; --text:#efe9da; --mute:#9a9385;
  --font:"DotGothic16","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.6;
  padding:20px 14px 60px;}
.wrap{max-width:760px;margin:0 auto}
h1{font-weight:400;font-size:28px;margin:8px 0 2px;letter-spacing:.08em}
.sub{color:var(--mute);font-size:14px;margin:0 0 18px}
.stripe{height:8px;background:linear-gradient(90deg,var(--red) 0 66%,var(--gold) 66% 100%);margin-bottom:16px}

/* playlist */
.list{list-style:none;margin:0;padding:0;background:var(--body);color:var(--ink);
  border:3px solid var(--ink);max-height:144px;overflow-y:auto}
.list li{display:flex;align-items:center;gap:10px;height:46px;padding:0 12px;cursor:pointer;
  border-bottom:2px solid var(--body-dk);font-size:17px}
.list li:hover{background:#e4dfd2}
.list li:focus-visible{outline:3px solid var(--red);outline-offset:-3px}
.list li .no{width:2.2em;color:#7c7567;font-size:14px}
.list li .t{flex:1}
.list li .st{font-size:13px;color:#7c7567}
.list li.on{background:var(--red);color:#fff}
.list li.on .no,.list li.on .st{color:#f4d3cf}
.list li.miss .st::after{content:"無音檔"}
.list li.on.miss .st::after{content:"無音檔"}

/* player */
.deck{margin-top:18px;background:var(--body);color:var(--ink);border:3px solid var(--ink);padding:14px}
.screen{background:var(--screen);border:4px solid var(--ink);padding:12px;
  background-image:repeating-linear-gradient(0deg,transparent 0 2px,var(--screen-ln) 2px 3px)}
.cover{width:100%;aspect-ratio:4/3;background:#000;display:flex;align-items:center;justify-content:center;
  overflow:hidden}
.cover img,.cover svg{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:block}
.now{color:var(--gold);font-size:20px;margin:10px 0 0}
.msg{color:#f2a59e;font-size:14px;min-height:1.4em;margin:2px 0 0}
.bar{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-size:14px}
input[type=range]{accent-color:var(--red);flex:1;min-width:0}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
button,label.btn{font:inherit;font-size:16px;background:var(--red);color:#fff;border:3px solid var(--ink);
  padding:6px 14px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
button:active,label.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible,label.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.alt,label.btn{background:var(--body-dk);color:var(--ink)}
button[aria-pressed=true]{background:var(--gold);color:var(--ink)}
.vol{display:flex;align-items:center;gap:6px;margin-left:auto;width:140px}
.load{margin-top:14px;padding-top:12px;border-top:2px dashed var(--body-dk);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.load span{font-size:13px;color:#5d574b;flex-basis:100%}
.load input{display:none}
.drive{margin-top:12px;font-size:13px;color:#5d574b}
.drive summary{cursor:pointer;font-size:15px;color:var(--ink)}
.drive textarea{width:100%;height:110px;margin:8px 0;font:13px/1.4 ui-monospace,Menlo,monospace;padding:6px;border:3px solid var(--ink);background:#f4f0e6;color:var(--ink)}
.msg a{color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>紅白機音樂盒</h1>
  <p class="sub">共 <span id="count"></span> 首，點選曲目開始播放</p>
  <div class="stripe"></div>

  <ul class="list" id="list" aria-label="曲目清單"></ul>

  <section class="deck" aria-label="播放器">
    <div class="screen">
      <div class="cover" id="cover"></div>
      <p class="now" id="now">請選擇曲目</p>
      <p class="msg" id="msg"></p>
    </div>

    <div class="bar">
      <span id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="播放進度">
      <span id="dur">0:00</span>
    </div>

    <div class="ctl">
      <button id="prev" aria-label="上一首">上一首</button>
      <button id="play">播放</button>
      <button id="next" aria-label="下一首">下一首</button>
      <button id="shuf" class="alt" aria-pressed="false">隨機</button>
      <button id="loop" class="alt" aria-pressed="false">單曲循環</button>
      <div class="vol"><span>音量</span><input type="range" id="vol" min="0" max="100" value="80" aria-label="音量"></div>
    </div>

    <div class="load">
      <span>音檔預設放在 music/ 資料夾（01.mp3、02.mp3…），封面放在 img/ 資料夾（01.jpg…）。也可以直接從電腦載入：</span>
      <label class="btn" tabindex="0">批次載入音檔<input type="file" id="audioPick" accept="audio/*" multiple></label>
      <label class="btn" tabindex="0">批次載入封面<input type="file" id="imgPick" accept="image/*" multiple></label>
    </div>

    <details class="drive">
      <summary>自訂 Google 雲端硬碟音檔連結（選用）</summary>
      <p>已內建預設連結，一般不用設定。若要替換，把分享連結貼在下方，一行一個，依 01、02… 的順序。順序不確定時，可在行首加編號，例如「05 https://drive.google.com/file/d/…」。</p>
      <textarea id="driveText" placeholder="https://drive.google.com/file/d/xxxxxxxx/view?usp=sharing" spellcheck="false"></textarea>
      <div class="ctl" style="margin-top:0">
        <button id="driveSave">儲存連結</button>
        <button id="driveClear" class="alt">還原預設</button>
      </div>
    </details>
  </section>
</div>

<audio id="audio" preload="none"></audio>

<script>
/* ===== 曲目資料：檔名用編號對應 music/編號.mp3 與 img/編號.jpg ===== */
const TITLES = [
  "雙截龍2","雙截龍3","熱血高校","熱血進行曲","魂斗羅","赤影","超級瑪利歐兄弟","薩爾達傳說",
  "俄羅斯方塊","馬戲團","洛克人2","洛克人3","忍者龍劍傳","惡魔城","宇宙巡航艦","兵蜂",
  "月風魔傳","勇者鬥惡龍","太空戰士","地球冒險","綠色兵團","銀衝浪手","太陽戰士","蝙蝠俠",
  "星際戰士／旅途","超惑星戰記","赤色要塞","特赦指令"
];
const AUDIO_EXT = ["mp3","m4a","ogg","wav"];
const IMG_EXT = ["jpg","png","webp","gif"];

/* Google 雲端硬碟檔案 ID（依 01～28 順序） */
const DRIVE_DEFAULT = [
  "1tTvG8kSSsv4kdkjjRkw5pYNs1Kikzlv1",
  "1o8v903dfrmh5XU-bnYqR01KSBYMk1jnb",
  "1-hnGSg11-cCEIO_F6I2LHvD4xaokL0GY",
  "1IJYhh46Avl4mIOUzwJMLSm5uj1J062Cq",
  "1u0KOUKI-d82_F8C6UvdoGgzdSoaFdp82",
  "1cuQphxMYrbYmbZ7W_JgFMCjPNunO5KWS",
  "1TE9rZtxW9uRfm4KYF9U7WAJzhoydPVPt",
  "1_ILqeZbXX1n8yfNfY-1RuV1_6YvubjzN",
  "1mkaaaBWYxQFAA6WYEdE2Keq_fCKc_QsX",
  "135n66Nd_csjz06UBQ_-z6l-cnd0vRjba",
  "1js8NsjgTl6FhumhOhBcf_8WclBZoBZ_0",
  "14Cxi3Cki0LQTdbI8MoitP7E7V27NH3bN",
  "1gPNgSJ1pDTd2-WurwWqOcZXxVo7CM6_U",
  "1yBtXTm98myjTttKmpQLYcMLasaLosbnr",
  "1yjgXvZ4DiA7u_nIEHUyA7TzyI5En4Rjn",
  "19KLHlkOQG1ylRJ79cCLXY6qZ5ksCdNV1",
  "1UrBL4_kdlNKPeAQ9TRwjbfRAYTR3UiS6",
  "1tGZqmJ_P17zV_dJ0cbNSUa2qnjXArN6G",
  "1f5Fg8AgVCPoEoKNXxxGEs3em_yy8yaHK",
  "1S4AaKYqWGU2QS9WzvbzeUrHjoy-dIp2v",
  "1lYENOk6aRe8S7NYb32COcaPbZylSIwyQ",
  "1DEbdzTw56eT5LVfZIs2PxcQBAYOU89OI",
  "1mOhETjlcwowB7X4luO7bfHjb-BUJKQV1",
  "1UlRyZGP07f4aJbuU4czd53c02_zxODrv",
  "1Ku9llJjjjeJzF5Sl70L96Fmh6lJBfOla",
  "1SIZKi3H4vT1D4oThWYvoBIJYXZVJ0PuA",
  "19DRxX4NFfEpmyWvQTHH5Wdy34PNdb-zi",
  "1ZwF0FvTTw85T5QN0MLQIRKkcF-jGrPgg"
];

const tracks = TITLES.map((title,i)=>({
  id:String(i+1).padStart(2,"0"), title, audioURL:null, imgURL:null, driveId:DRIVE_DEFAULT[i]||null, srcTry:0
}));

const $ = id => document.getElementById(id);
const audio = $("audio"), list = $("list"), cover = $("cover");
let cur = -1, shuffle = false, loop = false, audioExtIdx = 0;

$("count").textContent = tracks.length;

/* ===== 清單 ===== */
tracks.forEach((t,i)=>{
  const li = document.createElement("li");
  li.tabIndex = 0; li.dataset.i = i;
  li.innerHTML = `<span class="no">${t.id}</span><span class="t">${t.title}</span><span class="st"></span>`;
  li.addEventListener("click",()=>select(i));
  li.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();select(i);} });
  list.appendChild(li);
});

/* ===== 程式產生的像素封面（沒有圖片時使用） ===== */
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function pixelCover(t){
  let seed = hash(t.title), rnd = ()=> (seed = Math.imul(seed,1664525)+1013904223>>>0)/4294967296;
  const hue = Math.floor(rnd()*360), N = 8, S = 28;
  const bg = `hsl(${hue} 45% 22%)`, fg = `hsl(${(hue+150)%360} 70% 62%)`, fg2 = `hsl(${(hue+40)%360} 80% 70%)`;
  let cells = "";
  for(let y=0;y<N;y++) for(let x=0;x<N/2;x++){
    const r = rnd(); if(r<0.52) continue;
    const col = r>0.85 ? fg2 : fg;
    cells += `<rect x="${x*S}" y="${y*S}" width="${S}" height="${S}" fill="${col}"/>`;
    cells += `<rect x="${(N-1-x)*S}" y="${y*S}" width="${S}" height="${S}" fill="${col}"/>`;
  }
  return `<svg viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${t.title} 封面">
    <rect width="320" height="240" fill="${bg}"/>
    <g transform="translate(48 8)">${cells}</g>
    <rect x="0" y="196" width="320" height="44" fill="rgba(0,0,0,.65)"/>
    <text x="160" y="226" text-anchor="middle" font-size="24" fill="#fff" font-family="DotGothic16,sans-serif">${t.title}</text>
  </svg>`;
}

/* ===== 顯示封面：自訂載入 > img/編號.* > 產生的像素圖 ===== */
function showCover(t){
  cover.innerHTML = pixelCover(t);
  const tryLoad = src => new Promise(res=>{
    const im = new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=src;
  });
  (async()=>{
    let im = null;
    if(t.imgURL) im = await tryLoad(t.imgURL);
    for(let k=0; !im && k<IMG_EXT.length; k++) im = await tryLoad(`img/${t.id}.${IMG_EXT[k]}`);
    if(im && cur>=0 && tracks[cur]===t){ im.alt = t.title+" 封面"; cover.innerHTML=""; cover.appendChild(im); }
  })();
}

/* ===== 播放 ===== */
function select(i){
  cur = i; const t = tracks[i];
  [...list.children].forEach((li,k)=>li.classList.toggle("on",k===i));
  list.children[i].scrollIntoView({block:"nearest"});
  $("now").textContent = `${t.id}　${t.title}`;
  $("msg").textContent = "";
  showCover(t);
  audioExtIdx = 0; t.srcTry = 0;
  audio.src = t.audioURL || (t.driveId ? driveSrc(t.driveId,0) : `music/${t.id}.${AUDIO_EXT[0]}`);
  audio.play().catch(()=>{});
}
audio.addEventListener("error",()=>{
  const t = tracks[cur]; if(!t) return;
  if(!t.audioURL && !t.driveId && audioExtIdx < AUDIO_EXT.length-1){
    audioExtIdx++; audio.src = `music/${t.id}.${AUDIO_EXT[audioExtIdx]}`; audio.play().catch(()=>{}); return;
  }
  list.children[cur].classList.add("miss");
  if(t.driveId && !t.audioURL && t.srcTry < 1){
    t.srcTry++; audio.src = driveSrc(t.driveId,1); audio.play().catch(()=>{}); return;
  }
  if(t.driveId && !t.audioURL){
    $("msg").innerHTML = `雲端硬碟無法直接播放這首（檔案需設為「知道連結的任何人可檢視」）。<a href="https://drive.google.com/file/d/${t.driveId}/view" target="_blank" rel="noopener">在雲端硬碟開啟</a>`;
  } else {
    $("msg").textContent = `找不到音檔：music/${t.id}.mp3，可用下方「批次載入音檔」。`;
  }
  $("play").textContent = "播放";
});
audio.addEventListener("playing",()=>{ list.children[cur]?.classList.remove("miss"); $("msg").textContent=""; $("play").textContent="暫停"; });
audio.addEventListener("pause",()=>{ $("play").textContent="播放"; });
audio.addEventListener("ended",()=>{ if(loop){audio.currentTime=0;audio.play();} else step(1); });

function step(d){
  if(!tracks.length) return;
  if(shuffle && d>0){ let n; do{ n=Math.floor(Math.random()*tracks.length);}while(n===cur&&tracks.length>1); select(n); }
  else select((cur<0 ? (d>0?0:tracks.length-1) : (cur+d+tracks.length)%tracks.length));
}
$("next").onclick = ()=>step(1);
$("prev").onclick = ()=>step(-1);
$("play").onclick = ()=>{
  if(cur<0) return select(0);
  audio.paused ? audio.play().catch(()=>{}) : audio.pause();
};
$("shuf").onclick = e=>{ shuffle=!shuffle; e.currentTarget.setAttribute("aria-pressed",shuffle); };
$("loop").onclick = e=>{ loop=!loop; e.currentTarget.setAttribute("aria-pressed",loop); };
$("vol").oninput = e=>{ audio.volume = e.target.value/100; };
audio.volume = .8;

/* ===== 進度 ===== */
const fmt = s => isFinite(s) ? `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}` : "0:00";
audio.addEventListener("timeupdate",()=>{
  $("cur").textContent = fmt(audio.currentTime); $("dur").textContent = fmt(audio.duration);
  if(audio.duration) $("seek").value = audio.currentTime/audio.duration*1000;
});
$("seek").oninput = e=>{ if(audio.duration) audio.currentTime = e.target.value/1000*audio.duration; };

/* ===== 從電腦批次載入：檔名含編號（01）或曲名即可配對 ===== */
function matchTrack(name){
  const base = name.replace(/\.[^.]+$/,"");
  let k = tracks.findIndex(t=>base.includes(t.title));
  if(k<0){ const m = base.match(/^\D*(\d{1,2})(?!\d)/); if(m) k = parseInt(m[1],10)-1; }
  return (k>=0 && k<tracks.length) ? k : -1;
}
function bulk(files,key){
  let n=0;
  [...files].forEach(f=>{ const k = matchTrack(f.name); if(k>=0){ tracks[k][key]=URL.createObjectURL(f); list.children[k].classList.remove("miss"); n++; }});
  $("msg").textContent = `已配對 ${n} / ${files.length} 個檔案`;
  if(cur>=0 && key==="imgURL") showCover(tracks[cur]);
}
$("audioPick").onchange = e=>bulk(e.target.files,"audioURL");
$("imgPick").onchange = e=>bulk(e.target.files,"imgURL");
document.querySelectorAll("label.btn").forEach(l=>l.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();l.querySelector("input").click();} }));

/* ===== Google 雲端硬碟 ===== */
const driveSrc = (id,n) => n===0
  ? `https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t`
  : `https://drive.google.com/uc?export=download&id=${id}`;
const DRIVE_KEY = "fcDriveLinks";
function applyDrive(text){
  tracks.forEach((t,i)=>t.driveId=DRIVE_DEFAULT[i]||null);
  let seq = 0, n = 0;
  text.split(/\r?\n/).forEach(line=>{
    const pre = line.match(/^\s*(\d{1,2})\s+\S/);
    for(const m of line.matchAll(/(?:\/d\/|[?&]id=)([\w-]{15,})/g)){
      const k = pre ? parseInt(pre[1],10)-1 : seq++;
      if(k>=0 && k<tracks.length){ tracks[k].driveId = m[1]; n++; }
    }
  });
  return n;
}
try{ const saved = localStorage.getItem(DRIVE_KEY); if(saved){ $("driveText").value = saved; applyDrive(saved); } }catch(e){}
$("driveSave").onclick = ()=>{
  const txt = $("driveText").value, n = applyDrive(txt);
  try{ localStorage.setItem(DRIVE_KEY, txt); }catch(e){}
  $("msg").textContent = `已設定 ${n} 首雲端音檔`;
};
$("driveClear").onclick = ()=>{
  $("driveText").value = ""; applyDrive("");
  try{ localStorage.removeItem(DRIVE_KEY); }catch(e){}
  $("msg").textContent = "已還原預設雲端連結";
};

cover.innerHTML = `<svg viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg"><rect width="320" height="240" fill="#0f1a2b"/><text x="160" y="128" text-anchor="middle" font-size="22" fill="#e8b94a" font-family="DotGothic16,sans-serif">PUSH START</text></svg>`;
</script>
</body>
</html>
