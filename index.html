class ChiptuneAudioEngine {
            constructor() {
                this.ctx = null;
                this.masterGain = null;
                this.analyser = null;
                this.isPlaying = false;
                this.currentSongIndex = 0;
                this.currentStep = 0;
                this.timerId = null;
                this.isLooping = true;
                this.isMuted = false;
                this.volumeBeforeMute = 0.7;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                    
                    this.masterGain = this.ctx.createGain();
                    this.masterGain.gain.value = 0.7;

                    this.analyser = this.ctx.createAnalyser();
                    this.analyser.fftSize = 64;

                    this.masterGain.connect(this.analyser);
                    this.analyser.connect(this.ctx.destination);
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playSong(index) {
                this.init();
                this.stop();
                this.currentSongIndex = index;
                this.currentStep = 0;
                this.isPlaying = true;

                const song = SONGS[this.currentSongIndex];
                const stepDurationMs = (60 / song.tempo / 4) * 1000;

                this.timerId = setInterval(() => {
                    this.tick();
                }, stepDurationMs);

                updateUIState();
            }

            stop() {
                if (this.timerId) {
                    clearInterval(this.timerId);
                    this.timerId = null;
                }
                this.isPlaying = false;
                updateUIState();
            }

            setVolume(val) {
                if (this.masterGain) {
                    this.masterGain.gain.value = parseFloat(val);
                }
            }

            toggleMute() {
                if (!this.masterGain) return;
                if (this.isMuted) {
                    this.setVolume(this.volumeBeforeMute);
                    this.isMuted = false;
                } else {
                    this.volumeBeforeMute = this.masterGain.gain.value;
                    this.setVolume(0);
                    this.isMuted = true;
                }
                return this.isMuted;
            }

            // Pulse Channel (SQ1 / SQ2)
            playSquare(freq, duration, type = 'square') {
                if (!freq || freq <= 0 || this.isMuted) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.masterGain);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e){}
            }

            // Triangle Bass Channel
            playTriangle(freq, duration) {
                if (!freq || freq <= 0 || this.isMuted) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.masterGain);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e){}
            }

            // Noise Channel
            playNoise(duration) {
                if (this.isMuted) return;
                try {
                    const bufferSize = this.ctx.sampleRate * duration;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const output = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        output[i] = Math.random() * 2 - 1;
                    }
                    const whiteNoise = this.ctx.createBufferSource();
                    whiteNoise.buffer = buffer;
                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.005, this.ctx.currentTime + duration);
                    whiteNoise.connect(gain);
                    gain.connect(this.masterGain);
                    whiteNoise.start();
                } catch(e){}
            }

            tick() {
                const song = SONGS[this.currentSongIndex];
                const noteDuration = 60 / song.tempo / 4;

                // Pulse 1
                const melNote = song.melody[this.currentStep % song.melody.length];
                if (melNote && melNote !== 'SILENT') {
                    this.playSquare(NOTE_FREQ[melNote], noteDuration, 'square');
                    this.triggerChannelVisual('sq1');
                }

                // Triangle Bass
                const bassNote = song.bass[this.currentStep % song.bass.length];
                if (bassNote && bassNote !== 'SILENT') {
                    this.playTriangle(NOTE_FREQ[bassNote], noteDuration * 1.1);
                    this.triggerChannelVisual('tri');
                }

                // Noise Drum
                if (this.currentStep % 2 === 0) {
                    this.playNoise(0.03);
                    this.triggerChannelVisual('noi');
                }

                this.currentStep++;

                const totalLen = Math.max(song.melody.length, song.bass.length);
                if (this.currentStep >= totalLen) {
                    if (this.isLooping) {
                        this.currentStep = 0;
                    } else {
                        this.next();
                    }
                }
            }

            triggerChannelVisual(ch) {
                const el = document.getElementById(`ch-${ch}`);
                if (el) {
                    el.classList.add('channel-active');
                    setTimeout(() => el.classList.remove('channel-active'), 80);
                }
            }

            next() {
                const nextIdx = (this.currentSongIndex + 1) % SONGS.length;
                this.playSong(nextIdx);
            }

            prev() {
                const prevIdx = (this.currentSongIndex - 1 + SONGS.length) % SONGS.length;
                this.playSong(prevIdx);
            }
        }

function renderGameScene(){frame++;ctx.clearRect(0,0,W,H);drawScene(SONGS[synth.currentSongIndex]?.scene||'mario');requestAnimationFrame(renderGameScene)}
const vis=document.getElementById('visualizer-canvas'),vctx=vis.getContext('2d');function drawVisualizer(){const w=vis.width,h=vis.height;vctx.clearRect(0,0,w,h);if(synth.analyser&&synth.isPlaying){const a=new Uint8Array(synth.analyser.frequencyBinCount);synth.analyser.getByteFrequencyData(a);const bw=w/a.length;for(let i=0;i<a.length;i++){let bh=a[i]/255*h;vctx.fillStyle=i%2?'#e64d43':'#f4c65c';vctx.fillRect(i*bw,h-bh,Math.max(1,bw-2),bh)}}else{vctx.fillStyle='#657080';vctx.fillRect(0,h/2,w,2)}requestAnimationFrame(drawVisualizer)}
let activeFilter='all';function renderPlaylist(){const list=document.getElementById('playlist-container'),q=document.getElementById('search-input').value.trim().toLowerCase();list.innerHTML='';let found=0;SONGS.forEach((s,i)=>{const decade=Number(s.year)<1990?'1980':'1990';if(activeFilter!=='all'&&decade!==activeFilter)return;if(q&&!`${s.game} ${s.title} ${s.year}`.toLowerCase().includes(q))return;found++;const row=document.createElement('div');row.className='track'+(i===synth.currentSongIndex?' selected':'');row.innerHTML=`<div class="track-no">${i===synth.currentSongIndex?'▶':String(i+1).padStart(2,'0')}</div><div class="track-copy"><strong></strong><span></span></div><span class="track-year">${s.year}</span>`;row.querySelector('strong').textContent=s.game;row.querySelector('span').textContent=s.title;row.addEventListener('click',()=>synth.playSong(i));list.appendChild(row)});if(!found)list.innerHTML='<div class="empty">找不到符合的曲目</div>'}
function updateUIState(){const s=SONGS[synth.currentSongIndex];document.getElementById('track-title').textContent=s.game;document.getElementById('track-subtitle').textContent=s.title;document.getElementById('track-year').textContent=s.year;document.getElementById('now-playing-title').textContent=s.game+' — '+s.title;document.getElementById('mobile-title').textContent=s.game;document.getElementById('mobile-subtitle').textContent=s.title;document.getElementById('play-icon').textContent=synth.isPlaying?'Ⅱ':'▶';document.getElementById('play-text').textContent=synth.isPlaying?'PAUSE':'PLAY';document.getElementById('mobile-play').textContent=synth.isPlaying?'Ⅱ':'▶';document.getElementById('led').classList.toggle('on',synth.isPlaying);document.getElementById('audio-status').textContent=synth.isPlaying?'PLAYING / 播放中':'PAUSED / 已暫停';document.getElementById('play-state').textContent=synth.isPlaying?'8-BIT AUDIO　•　'+s.tempo+' BPM':'播放已暫停';document.getElementById('scene-tag').textContent=s.game.toUpperCase()+'　/　'+s.year+'　/　PIXEL WORLD';renderPlaylist()}
// Loop is enabled by default. When disabled, move to next track at end.
document.getElementById('btn-play').onclick=()=>synth.isPlaying?synth.stop():synth.playSong(synth.currentSongIndex);
document.getElementById('mobile-play').onclick=()=>synth.isPlaying?synth.stop():synth.playSong(synth.currentSongIndex);
document.getElementById('btn-next').onclick=()=>synth.next();document.getElementById('mobile-next').onclick=()=>synth.next();document.getElementById('btn-prev').onclick=()=>synth.prev();document.getElementById('mobile-prev').onclick=()=>synth.prev();
document.getElementById('btn-loop').onclick=()=>{synth.isLooping=!synth.isLooping;document.getElementById('btn-loop').classList.toggle('active',synth.isLooping);document.getElementById('btn-loop').title=synth.isLooping?'單曲循環：開':'單曲循環：關';showToast(synth.isLooping?'單曲循環已開啟':'單曲循環已關閉')};
document.getElementById('volume-slider').oninput=e=>{const v=Number(e.target.value);synth.setVolume(v);document.getElementById('volume-val').textContent=Math.round(v*100)+'%';if(v>0&&synth.isMuted)synth.isMuted=false};
document.getElementById('search-input').oninput=renderPlaylist;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{activeFilter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('selected',x===b));renderPlaylist()});
let toastTimer;function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1500)}
// Canvas adapts sharply to device pixel ratio while keeping pixel edges crisp.
function resizeCanvas(){const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=640*dpr;canvas.height=400*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false}window.addEventListener('resize',resizeCanvas);resizeCanvas();
renderPlaylist();updateUIState();renderGameScene();drawVisualizer();
